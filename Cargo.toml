[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
# The crates ship inside the Hex tarball, so their version is the Hex `musubi`
# version — one release stream, no crate/server pairing table (rust-client §13).
version = "0.13.1"
edition = "2024"
# MSRV: 1.85 is the first stable toolchain with edition 2024 (rust-client §1.4).
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/fahchen/musubi"
authors = ["Phil Chen"]

[workspace.dependencies]
futures-channel = "0.3"
futures-core = "0.3"
futures-executor = "0.3"
futures-sink = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
json-patch = "4"
musubi-client = { path = "crates/musubi-client" }
phoenix-channel = { path = "crates/phoenix-channel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "net"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
