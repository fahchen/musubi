[workspace]
members = ["crates/*"]
# `musubi-gpui` carries its own `[workspace]` table and its own `Cargo.lock`
# (`docs/rust-reactive-state.md` §5.1). Both halves are required: without the
# exclusion gpui lands in the root `Cargo.lock`, `cargo test --workspace` starts
# building it, and the runtime-free gates gain something to reason about. The
# precedent is `examples/chat_room/desktop`, one directory over.
exclude = ["crates/musubi-gpui"]
resolver = "3"

[workspace.package]
# The crates ship inside the Hex tarball, so their version is the Hex `musubi`
# version — one release stream, no crate/server pairing table (rust-client §13).
version = "0.13.1"
edition = "2024"
# MSRV: 1.85 is the first stable toolchain with edition 2024 (rust-client §1.4).
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/fahchen/musubi"
authors = ["Phil Chen"]

[workspace.dependencies]
futures-channel = "0.3"
futures-core = "0.3"
futures-executor = "0.3"
futures-sink = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
musubi-client = { path = "crates/musubi-client" }
musubi-state = { path = "crates/musubi-state" }
phoenix-channel = { path = "crates/phoenix-channel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slotmap = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "net"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
